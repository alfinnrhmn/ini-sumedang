version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuxt-core:
        patterns: ["nuxt", "@nuxt/*", "nitropack", "vue", "vue-router"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
